name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero dependencies — the validators use only the Node standard library.
      - run: node .scripts/validate-okf.mjs
      - run: node .scripts/validate-links.mjs
      - run: node .scripts/validate-index.mjs
      - run: node .scripts/validate-platforms.mjs
      - run: node .scripts/validate-dictionary.mjs
