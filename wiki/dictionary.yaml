# Glossary of abbreviations and jargon used across the wiki.
# Every term needs a `definition`; add `expansion` for abbreviations and
# `see` for related technique ids (path under wiki/ without the .md).
#
# Example:
#   LOD:
#     expansion: Level of Detail
#     definition: >
#       Swapping a mesh for progressively simpler versions as it recedes
#       from the camera, trading detail nobody sees for GPU time.
#     see: [lod-selection]
terms:
  gradient noise:
    definition: >
      Noise built from pseudo-random gradient vectors on a lattice whose dot
      products are smoothly interpolated (Perlin, simplex, OpenSimplex) —
      smooth and band-limited, unlike per-point value/white noise.
    see: [perlin-noise-terrain]
  fBm:
    expansion: fractal Brownian motion
    definition: >
      Summing several octaves of noise, each at higher frequency and lower
      amplitude, so large landforms and fine detail coexist in one field.
    see: [perlin-noise-terrain]
  octave:
    definition: >
      One layer in an fBm sum; each successive octave roughly doubles the
      noise frequency and halves its amplitude.
    see: [perlin-noise-terrain]
  lacunarity:
    definition: >
      The per-octave frequency multiplier in fBm (commonly ~2.0); higher
      values spread octaves further apart in feature size.
    see: [perlin-noise-terrain]
  persistence:
    definition: >
      The per-octave amplitude multiplier in fBm (commonly ~0.5); higher
      values keep fine octaves stronger, making terrain rougher.
    see: [perlin-noise-terrain]
  heightmap:
    definition: >
      A 2D grid (or function) mapping each (x, z) position to one height —
      cheap and streamable, but unable to represent caves or overhangs.
    see: [perlin-noise-terrain]
  skybox:
    definition: >
      A cube of sky imagery wrapped around the world and drawn as if
      infinitely far, so players mistake it for real distance.
    see: [worley-noise-skies]
  Worley noise:
    definition: >
      Cellular noise made by scattering points in a grid and coloring each
      position by distance to the nearest point; reads as cells or clouds.
    see: [worley-noise-skies]
  Gerstner wave:
    definition: >
      A water waveform that moves surface points in circles instead of
      straight up-down, producing sharp crests real sines can't.
    see: [gerstner-waves]
  lag compensation:
    definition: >
      Server-side rewind: judging a shot against where the target was when
      the shooter saw them, canceling network delay.
    see: [lag-compensation]
  rollback netcode:
    definition: >
      Netcode that plays local input instantly and lets remote clients skip
      or fast-forward missed frames when late input arrives.
    see: [rollback-netcode]
  hitscan:
    definition: >
      Shot judgment by an instant ray along the aim instead of a simulated
      projectile.
    see: [hitscan-shooting]
  head glitch:
    definition: >
      Camera-origin shooting abuse — behind low cover the camera can see
      and shoot while the shooter's body stays protected.
    see: [hitscan-shooting]
  hitbox:
    definition: >
      The simple collision shape a game tests instead of the visible body;
      attack and hurt boxes are tuned separately, often per frame.
    see: [generous-hitboxes]
  hit-stop:
    definition: >
      Freezing the game a few frames on impact so a landed hit is felt.
    see: [generous-hitboxes]
  coyote time:
    definition: >
      A short grace window after leaving a ledge during which a jump still
      counts.
    see: [coyote-time-jump-buffering]
  jump buffering:
    definition: >
      Queuing a jump pressed just before landing so it fires on the exact
      touchdown frame.
    see: [coyote-time-jump-buffering]
  corner correction:
    definition: >
      Nudging a character sideways or up when they barely clip a geometry
      corner, letting the jump or dash continue.
    see: [corner-correction]
  billboard:
    definition: >
      A flat image rotated every frame to face the camera, faking 3D
      presence cheaply.
    see: [billboarding]
  dithering:
    definition: >
      Interleaving two colors in a pattern to fake a gradient within a
      limited palette.
    see: [pixel-art-rules]
  sub-pixel animation:
    definition: >
      Suggesting motion smaller than one pixel by shifting colors inside
      the sprite instead of moving it.
    see: [pixel-art-rules]
  palette swap:
    definition: >
      Rebinding one sprite's index data to a different color table for
      cheap variants.
    see: [palette-indexed-graphics]
  Mode 7:
    definition: >
      The Super Famicom feature that affine-transforms a background layer
      per scanline, faking a 3D ground plane from a flat tilemap.
    see: [mode-7-affine]
  additive blending:
    definition: >
      Compositing by adding color values — only brightens, like light;
      the standard mode for glows and particles.
    see: [blend-modes]
  multiply blending:
    definition: >
      Compositing by multiplying color values — only darkens, like
      pigment; the standard mode for shadows and tints.
    see: [blend-modes]
  A*:
    definition: >
      Shortest-path search that prioritizes by cost-so-far plus an
      obstacle-ignoring estimate to the goal, focusing the search.
    see: [astar-pathfinding]
  flow field:
    definition: >
      A precomputed best-direction-per-region map toward one goal that
      many agents can follow without individual path searches.
    see: [astar-pathfinding]
  IK:
    expansion: inverse kinematics
    definition: >
      Solving joint positions backwards from a chosen end-effector target
      (place the foot, derive the knee).
    see: [inverse-kinematics]
  Euler integration:
    definition: >
      Stepping motion per frame — add acceleration to velocity, velocity
      to position — instead of solving exact equations.
    see: [jump-physics-euler]
  Elo rating:
    definition: >
      A skill score where the gap between two players predicts win
      probability and points transfer by how surprising the result was.
    see: [elo-matchmaking]
  rubber banding:
    definition: >
      Racing-style difficulty aid that slows leaders and boosts trailers
      so the pack stays close regardless of skill.
    see: [dynamic-difficulty-adjustment]
  DDA:
    expansion: dynamic difficulty adjustment
    definition: >
      Quietly tuning challenge to measured player performance in real
      time.
    see: [dynamic-difficulty-adjustment]
  pity timer:
    definition: >
      A miss counter that guarantees the top reward at a cap, bounding
      worst-case bad luck.
    see: [pity-timers-and-prd]
  shuffle bag:
    definition: >
      Drawing outcomes from a bag without replacement and refilling only
      when empty, so no outcome can drought for long.
    see: [pity-timers-and-prd]
  PRD:
    expansion: pseudo-random distribution
    definition: >
      Variable per-try odds that grow after each miss and reset on
      success, keeping the advertised average without streaks.
    see: [pity-timers-and-prd]
  PRNG:
    expansion: pseudo-random number generator
    definition: >
      A deterministic sequence of random-looking numbers grown from a
      seed; same seed, same "luck".
    see: [prng-seed-manipulation]
  seed:
    definition: >
      The initial value that determines a PRNG's entire output sequence —
      and therefore every "random" outcome derived from it.
    see: [prng-seed-manipulation]
  checksum:
    definition: >
      A small value derived from data (like a digit sum) used to detect
      tampering or typos when the data is re-entered.
    see: [password-save-systems]
  ACE:
    expansion: arbitrary code execution
    definition: >
      Getting a program to execute attacker-chosen data as code — in
      classic games, via memory corruption plus controller input.
    see: [arbitrary-code-execution]
  Z-targeting:
    definition: >
      Ocarina of Time's lock-on: one button snaps camera and character to
      an enemy and remaps movement to orbit it.
    see: [z-targeting-lock-on]
  frustum:
    definition: >
      The truncated-pyramid volume a perspective camera can see, bounded
      by the near and far planes and four side planes.
    see: [frustum-culling]
  occlusion culling:
    definition: >
      Skipping objects hidden behind other objects — the complement of
      frustum culling, which only removes what's outside the view.
    see: [frustum-culling]
  GC:
    expansion: garbage collection
    definition: >
      Automatic memory reclamation in managed runtimes; its unpredictable
      pauses show up as frame hitches — the spikes pooling avoids.
    see: [object-pooling]
  LOD:
    expansion: level of detail
    definition: >
      Swapping a mesh for progressively simpler versions as it shrinks on
      screen, trading detail nobody can see for GPU time.
    see: [level-of-detail]
  pop:
    definition: >
      A visible one-frame switch — an LOD level or impostor swapping in
      without a blended transition.
    see: [level-of-detail]
  voxel:
    definition: >
      One cell of a 3D grid — the volumetric counterpart of a pixel —
      holding a material, a density, or gameplay data for that coordinate.
    see: [voxel-terrain]
  chunk:
    definition: >
      A fixed block of adjacent voxels treated as the unit of meshing,
      streaming, and culling (Minecraft: a 16×16 column of the world).
    see: [voxel-terrain]
  dual contouring:
    definition: >
      Isosurface extraction that places one vertex inside each cell of a
      density field and joins neighbors, yielding smooth carvable surfaces
      instead of cubes.
    see: [voxel-terrain]
  normal map:
    definition: >
      A texture storing the surface direction per texel (XYZ packed as RGB)
      so lighting varies across a flat polygon or sprite.
    see: [normal-mapping]
  tangent space:
    definition: >
      The per-texel coordinate frame (tangent, bitangent, normal) a normal
      map is expressed in, so one map stays valid as the surface moves.
    see: [normal-mapping]
  bump map:
    definition: >
      The single-channel ancestor of the normal map: stores height and lets
      the shader derive slope, rather than storing direction outright.
    see: [normal-mapping]
  air absorption:
    definition: >
      Frequency-dependent loss over distance — high frequencies fade
      faster than low — which is why far-off sounds are dull, not just
      quiet.
    see: [spatial-audio-physics]
  Doppler shift:
    definition: >
      The pitch change from relative motion between source and listener:
      up while approaching, down while receding.
    see: [spatial-audio-physics]
  reverb:
    definition: >
      The dense tail of reflections an enclosed space adds to a sound;
      its length and color describe the room's size and materials.
    see: [spatial-audio-physics]
  sound occlusion:
    definition: >
      Attenuating and muffling a sound whose path to the listener is
      blocked by geometry — the audio counterpart of occlusion culling.
    see: [spatial-audio-physics]
  procedural audio:
    definition: >
      Sound produced at runtime from parameters — layers assembled or
      samples synthesized on demand — instead of played back from a
      recording made for that one object.
    see: [procedural-sound-effects]
  modal synthesis:
    definition: >
      Synthesizing an impact or ring as a small set of damped resonances
      whose frequencies and decay come from the object's material and size.
    see: [procedural-sound-effects]
  granular synthesis:
    definition: >
      Building continuous sound (rolling, scraping) from rapidly repeated
      short grains whose rate and pitch follow a driving parameter such as
      contact speed.
    see: [procedural-sound-effects]
  adaptive music:
    definition: >
      Music written for game state rather than a timeline, so it changes
      with events instead of looping past them.
    see: [adaptive-music]
  stem:
    definition: >
      One separately mixed layer of a piece of music, kept as its own track
      so it can be faded in or out independently.
    see: [adaptive-music]
  vertical layering:
    definition: >
      Adding and removing instrument layers of one piece on a shared clock
      as events escalate; also called vertical remixing.
    see: [adaptive-music]
  horizontal re-sequencing:
    definition: >
      Assembling music from interchangeable phrases that can follow one
      another in any order, so the loop and its transitions stay musical.
    see: [adaptive-music]
  stinger:
    definition: >
      A short transition cue played over a state change to cover the seam
      before the next theme starts.
    see: [adaptive-music]
  look-ahead camera:
    definition: >
      A camera offset in the direction of travel, so the player sees more
      of what is coming than of what they crossed.
    see: [camera-framing-lookahead]
  landmark:
    definition: >
      A structure legible from far off that a player navigates by, doing
      the work a waypoint marker otherwise does.
    see: [landmark-guided-level-design]
  pinch point:
    definition: >
      A place where branching routes are made to recombine, so a level
      stays buildable and testable despite offering choices.
    see: [landmark-guided-level-design]
