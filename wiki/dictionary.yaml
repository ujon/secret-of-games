# Glossary of abbreviations and jargon used across the wiki.
# Every term needs a `definition`; add `expansion` for abbreviations and
# `see` for related technique ids (path under wiki/ without the .md).
#
# Example:
#   LOD:
#     expansion: Level of Detail
#     definition: >
#       Swapping a mesh for progressively simpler versions as it recedes
#       from the camera, trading detail nobody sees for GPU time.
#     see: [lod-selection]
terms:
  gradient noise:
    definition: >
      Noise built from pseudo-random gradient vectors on a lattice whose dot
      products are smoothly interpolated (Perlin, simplex, OpenSimplex),
      producing a spatially correlated field rather than independent samples.
    see: [perlin-noise-terrain]
  fBm:
    expansion: fractal Brownian motion
    definition: >
      Summing several octaves of noise, each at higher frequency and lower
      amplitude, so large landforms and fine detail coexist in one field.
    see: [perlin-noise-terrain]
  octave:
    definition: >
      One layer in an fBm sum; each successive octave roughly doubles the
      noise frequency and halves its amplitude.
    see: [perlin-noise-terrain]
  lacunarity:
    definition: >
      The per-octave frequency multiplier in fBm (commonly ~2.0); higher
      values spread octaves further apart in feature size.
    see: [perlin-noise-terrain]
  persistence:
    definition: >
      The per-octave amplitude multiplier in fBm (commonly ~0.5); higher
      values keep fine octaves stronger, making terrain rougher.
    see: [perlin-noise-terrain]
  heightmap:
    definition: >
      A 2D grid (or function) mapping each (x, z) position to one height —
      cheap and streamable, but unable to represent caves or overhangs.
    see: [perlin-noise-terrain]
  skybox:
    definition: >
      A cube of sky imagery wrapped around the world and drawn as if
      infinitely far, so players mistake it for real distance.
    see: [worley-noise-skies]
  Worley noise:
    definition: >
      Cellular noise made by scattering points in a grid and coloring each
      position by distance to the nearest point; reads as cells or clouds.
    see: [worley-noise-skies]
  Gerstner wave:
    definition: >
      A water waveform that moves surface points in circles instead of
      straight up-down, producing sharp crests real sines can't.
    see: [gerstner-waves]
  lag compensation:
    definition: >
      Server-side rewind that judges a shot against the target's historical
      position at the estimated time shown in the shooter's view.
    see: [lag-compensation]
  client view interpolation:
    definition: >
      Rendering remote objects between buffered server updates to smooth
      motion, introducing a viewing delay that lag compensation must account for.
    see: [lag-compensation]
  rollback netcode:
    definition: >
      Netcode that applies local input immediately and predicts missing remote
      inputs, then restores a saved state and re-simulates when late inputs disagree.
    see: [rollback-netcode]
  hitscan:
    definition: >
      Shot judgment by an instant ray along the aim instead of a simulated
      projectile.
    see: [hitscan-shooting]
  head glitch:
    definition: >
      Camera-origin shooting abuse — behind low cover the camera can see
      and shoot while the shooter's body stays protected.
    see: [hitscan-shooting]
  hitbox:
    definition: >
      The simple collision shape a game tests instead of the visible body;
      attack and hurt boxes are tuned separately, often per frame.
    see: [generous-hitboxes]
  hit-stop:
    definition: >
      Freezing the game a few frames on impact so a landed hit is felt.
    see: [generous-hitboxes]
  coyote time:
    definition: >
      A short grace window after leaving a ledge during which a jump still
      counts.
    see: [coyote-time-jump-buffering]
  jump buffering:
    definition: >
      Queuing a jump pressed just before landing so it fires on the exact
      touchdown frame.
    see: [coyote-time-jump-buffering]
  corner correction:
    definition: >
      Nudging a character sideways or up when they barely clip a geometry
      corner, letting the jump or dash continue.
    see: [corner-correction]
  billboard:
    definition: >
      A flat image rotated every frame to face the camera, faking 3D
      presence cheaply.
    see: [billboarding]
  dithering:
    definition: >
      Interleaving two colors in a pattern to fake a gradient within a
      limited palette.
    see: [pixel-art-rules]
  sub-pixel animation:
    definition: >
      Suggesting motion smaller than one pixel by shifting colors inside
      the sprite instead of moving it.
    see: [pixel-art-rules]
  palette swap:
    definition: >
      Rebinding one sprite's index data to a different color table for
      cheap variants.
    see: [palette-indexed-graphics]
  Mode 7:
    definition: >
      The Super Famicom feature that affine-transforms a background layer
      per scanline, faking a 3D ground plane from a flat tilemap.
    see: [mode-7-affine]
  additive blending:
    definition: >
      Compositing by adding color values — only brightens, like light;
      the standard mode for glows and particles.
    see: [blend-modes]
  multiply blending:
    definition: >
      Compositing by multiplying color values — only darkens, like
      pigment; the standard mode for shadows and tints.
    see: [blend-modes]
  A*:
    definition: >
      Shortest-path search that prioritizes by cost-so-far plus an
      obstacle-ignoring estimate to the goal, focusing the search.
    see: [astar-pathfinding]
  flow field:
    definition: >
      A precomputed best-direction-per-region map toward one goal that
      many agents can follow without individual path searches.
    see: [astar-pathfinding]
  BSP:
    expansion: binary space partitioning
    definition: >
      Recursive division of space into two regions at each node of a tree,
      used to organize visibility and traversal of geometry.
    see: [raycast-line-of-sight]
  IK:
    expansion: inverse kinematics
    definition: >
      Solving joint positions backwards from a chosen end-effector target
      (place the foot, derive the knee).
    see: [inverse-kinematics]
  Euler integration:
    definition: >
      Stepping motion per frame — add acceleration to velocity, velocity
      to position — instead of solving exact equations.
    see: [jump-physics-euler]
  Elo rating:
    definition: >
      A skill score where the gap between two players predicts win
      probability and points transfer by how surprising the result was.
    see: [elo-matchmaking]
  rubber banding:
    definition: >
      Racing-style difficulty aid that slows leaders and boosts trailers
      so the pack stays close regardless of skill.
    see: [dynamic-difficulty-adjustment]
  DDA:
    expansion: dynamic difficulty adjustment
    definition: >
      Quietly tuning challenge to measured player performance in real
      time.
    see: [dynamic-difficulty-adjustment]
  pity timer:
    definition: >
      A miss counter that guarantees the top reward at a cap, bounding
      worst-case bad luck.
    see: [pity-timers-and-prd]
  shuffle bag:
    definition: >
      Drawing outcomes from a bag without replacement and refilling only
      when empty, so no outcome can drought for long.
    see: [pity-timers-and-prd]
  PRD:
    expansion: pseudo-random distribution
    definition: >
      Variable per-try odds that grow after each miss and reset on
      success, calibrated to an overall success rate while reducing extreme
      failure streaks.
    see: [pity-timers-and-prd]
  PRNG:
    expansion: pseudo-random number generator
    definition: >
      A generator of deterministic, random-looking numbers; the same initial
      state and call sequence reproduce the same values.
    see: [prng-seed-manipulation]
  seed:
    definition: >
      A value used to initialize a PRNG's state. Reproducing game outcomes
      also requires matching the relevant game state and order of random calls.
    see: [prng-seed-manipulation]
  checksum:
    definition: >
      A small value derived from data (like a digit sum) used to detect
      tampering or typos when the data is re-entered.
    see: [password-save-systems, save-state-serialization, alternating-save-slots]
  ACE:
    expansion: arbitrary code execution
    definition: >
      Getting a program to execute attacker-chosen data as code — in
      classic games, via memory corruption plus controller input.
    see: [arbitrary-code-execution]
  Z-targeting:
    definition: >
      Ocarina of Time's lock-on: one button snaps camera and character to
      an enemy and remaps movement to orbit it.
    see: [z-targeting-lock-on]
  frustum:
    definition: >
      The truncated-pyramid volume a perspective camera can see, bounded
      by the near and far planes and four side planes.
    see: [frustum-culling]
  occlusion culling:
    definition: >
      Skipping objects hidden behind other objects — the complement of
      frustum culling, which only removes what's outside the view.
    see: [occlusion-culling, frustum-culling]
  occluder:
    definition: >
      Geometry that blocks the camera's view of other objects during an occlusion test.
    see: [occlusion-culling]
  occludee:
    definition: >
      An object or spatial group whose visibility is tested against occluders.
    see: [occlusion-culling]
  GC:
    expansion: garbage collection
    definition: >
      Automatic memory reclamation in managed runtimes. Collection work can
      cause frame hitches; pooling can reduce allocation pressure but does not
      eliminate every collection or pause.
    see: [object-pooling]
  LOD:
    expansion: level of detail
    definition: >
      Swapping a mesh for progressively simpler versions as it shrinks on
      screen, trading detail nobody can see for GPU time.
    see: [level-of-detail, hair-cards, guide-hair-simulation]
  pop:
    definition: >
      A visible one-frame switch — an LOD level or impostor swapping in
      without a blended transition.
    see: [level-of-detail]
  voxel:
    definition: >
      One cell of a 3D grid — the volumetric counterpart of a pixel —
      holding a material, a density, or gameplay data for that coordinate.
    see: [voxel-terrain, volumetric-smoke]
  chunk:
    definition: >
      A fixed block of adjacent voxels treated as the unit of meshing,
      streaming, and culling (Minecraft: a 16×16 column of the world).
    see: [voxel-terrain]
  dual contouring:
    definition: >
      Isosurface extraction that places one vertex inside each cell of a
      density field and joins neighbors, yielding smooth carvable surfaces
      instead of cubes.
    see: [voxel-terrain]
  normal map:
    definition: >
      A texture storing the surface direction per texel (XYZ packed as RGB)
      so lighting varies across a flat polygon or sprite.
    see: [normal-mapping]
  tangent space:
    definition: >
      The per-texel coordinate frame (tangent, bitangent, normal) a normal
      map is expressed in, so one map stays valid as the surface moves.
    see: [normal-mapping]
  bump map:
    definition: >
      The single-channel ancestor of the normal map: stores height and lets
      the shader derive slope, rather than storing direction outright.
    see: [normal-mapping]
  air absorption:
    definition: >
      Frequency-dependent loss over distance — high frequencies fade
      faster than low — which is why far-off sounds are dull, not just
      quiet.
    see: [spatial-audio-physics]
  Doppler shift:
    definition: >
      The pitch change from relative motion between source and listener:
      up while approaching, down while receding.
    see: [spatial-audio-physics]
  reverb:
    definition: >
      The dense tail of reflections an enclosed space adds to a sound;
      its length and color describe the room's size and materials.
    see: [spatial-audio-physics]
  sound occlusion:
    definition: >
      Attenuating and muffling a sound whose path to the listener is
      blocked by geometry — the audio counterpart of occlusion culling.
    see: [spatial-audio-physics]
  procedural audio:
    definition: >
      Sound produced at runtime from parameters — layers assembled or
      samples synthesized on demand — instead of played back from a
      recording made for that one object.
    see: [procedural-sound-effects]
  modal synthesis:
    definition: >
      Synthesizing an impact or ring as a small set of damped resonances
      whose frequencies and decay come from the object's material and size.
    see: [procedural-sound-effects]
  granular synthesis:
    definition: >
      Building continuous sound (rolling, scraping) from rapidly repeated
      short grains whose rate and pitch follow a driving parameter such as
      contact speed.
    see: [procedural-sound-effects]
  adaptive music:
    definition: >
      Music written for game state rather than a timeline, so it changes
      with events instead of looping past them.
    see: [adaptive-music]
  stem:
    definition: >
      One separately mixed layer of a piece of music, kept as its own track
      so it can be faded in or out independently.
    see: [adaptive-music]
  vertical layering:
    definition: >
      Adding and removing instrument layers of one piece on a shared clock
      as events escalate; also called vertical remixing.
    see: [adaptive-music]
  horizontal re-sequencing:
    definition: >
      Assembling music from interchangeable phrases that can follow one
      another in any order, so the loop and its transitions stay musical.
    see: [adaptive-music]
  stinger:
    definition: >
      A short transition cue played over a state change to cover the seam
      before the next theme starts.
    see: [adaptive-music]
  look-ahead camera:
    definition: >
      A camera offset in the direction of travel, so the player sees more
      of what is coming than of what they crossed.
    see: [camera-framing-lookahead]
  landmark:
    definition: >
      A structure legible from far off that a player navigates by, doing
      the work a waypoint marker otherwise does.
    see: [landmark-guided-level-design]
  pinch point:
    definition: >
      A place where branching routes are made to recombine, so a level
      stays buildable and testable despite offering choices.
    see: [landmark-guided-level-design]
  spring arm:
    definition: >
      A camera boom from a target pivot to the desired lens position whose
      usable length retracts when a collision probe finds geometry.
    see: [camera-collision-avoidance]
  camera pivot:
    definition: >
      The tracking point a camera rig rotates or extends around, commonly
      placed near the followed character's torso or head rather than at the
      lens itself.
    see: [camera-collision-avoidance, interior-camera-zones]
  shape cast:
    definition: >
      Sweeping a sphere, capsule, box, or other collision volume through
      space and reporting what it would hit, unlike a zero-width raycast.
    see: [camera-collision-avoidance]
  collision mask:
    definition: >
      A bit set selecting which physics layers a query or body can hit, used
      to make camera probes ignore the followed character, foliage, and
      other nonblocking geometry.
    see: [camera-collision-avoidance, occluder-reveal-effects]
  damping:
    definition: >
      Smoothing a changing value over time so it approaches its target
      instead of snapping there in one frame.
    see: [camera-smoothing-deadzone, camera-collision-avoidance, occluder-reveal-effects]
  yaw:
    definition: >
      Rotation left or right around the current up axis, distinct from
      looking up or down.
    see: [camera-collision-avoidance]
  parallax:
    definition: >
      The apparent shift between near and far objects as the viewpoint moves;
      changing camera position can therefore change where an aim ray appears
      relative to the world.
    see: [billboarding, camera-collision-avoidance, normal-mapping, interior-mapping, flipbook-particles]
  near plane:
    definition: >
      The closest rectangular boundary of a camera frustum; geometry that
      intersects it appears sliced open even when the lens point is clear.
    see: [camera-collision-avoidance, frustum-culling]
  camera occluder:
    definition: >
      A wall, roof, prop, or other rendered object between the camera and a
      subject the game has decided must remain visible.
    see: [occluder-reveal-effects]
  dithered transparency:
    definition: >
      Faking partial transparency by discarding a changing pattern of opaque
      pixels, avoiding full alpha sorting at the cost of stipple or ghosting.
    see: [occluder-reveal-effects]
  alpha clipping:
    definition: >
      Discarding fragments whose opacity falls below a threshold so the
      survivors can remain depth-writing opaque or masked pixels instead of
      using sorted translucent blending.
    see: [occluder-reveal-effects]
  temporal anti-aliasing:
    definition: >
      Smoothing edges by combining jittered samples from several frames;
      useful for dithered fades but liable to leave trails on moving patterns.
    see: [occluder-reveal-effects]
  cutaway:
    definition: >
      Removing a local piece of a blocking surface, or a whole roof or upper
      floor, so an otherwise hidden interior stays readable.
    see: [occluder-reveal-effects, interior-camera-zones]
  camera zone:
    definition: >
      An authored area that overrides camera distance, angle, framing, or
      visibility rules according to the subject, lens, or selected focus's
      relationship to a particular space.
    see: [interior-camera-zones, camera-framing-lookahead]
  portal:
    definition: >
      A modeled connection such as a door, window, or opening between two
      rooms, used to determine when spatial or camera ownership transfers.
    see: [interior-camera-zones, gameplay-scale-architecture, dot-product-tests]
  hysteresis:
    definition: >
      Using different enter and exit thresholds, or a hold time, so a system
      does not flicker between two states at one boundary.
    see: [interior-camera-zones, camera-collision-avoidance, level-of-detail]
  FOV:
    expansion: field of view
    definition: >
      The angular width of the world visible through a camera; changing it
      alters both how much fits on screen and the apparent perspective.
    see: [interior-camera-zones, gameplay-scale-architecture, dot-product-tests]
  control reference frame:
    definition: >
      The orientation that maps stick directions to world or character
      movement; a camera crossing sides can change what "forward" means.
    see: [interior-camera-zones, camera-collision-avoidance]
  biome:
    definition: >
      A named region type whose rules determine environmental properties such as surface materials, vegetation, ambience, and creature spawning.
    see: [biome-generation]
  noise field:
    definition: >
      A function assigning a noise value to each position; smoothly varying fields give nearby positions correlated values.
    see: [biome-generation, perlin-noise-terrain]
  input randomness:
    definition: >
      A random event revealed before the player makes the decision being considered, allowing a response to its outcome.
    see: [input-output-randomness]
  output randomness:
    definition: >
      A random event that resolves after the player commits to the decision being considered, leaving the outcome uncertain at commitment.
    see: [input-output-randomness]
  level metrics:
    definition: >
      A project's tested dimensions for spaces and movement, such as doorway widths, ceiling heights, and clearance between obstacles.
    see: [gameplay-scale-architecture]
  graybox:
    definition: >
      A playable level built with simple placeholder geometry to test scale, movement, and layout before final art.
    see: [gameplay-scale-architecture]
  collision capsule:
    definition: >
      A simplified collision volume consisting of a cylinder with hemispherical ends, commonly used to represent a character's occupied space.
    see: [gameplay-scale-architecture]
  push-forward combat:
    definition: >
      Combat design that rewards deliberate engagement and movement, often by tying recovery of health or other resources to attacks.
    see: [push-forward-combat]
  Regain:
    definition: >
      Bloodborne's mechanic that permits recovery of recently lost health by striking enemies within a short time window.
    see: [push-forward-combat]
  dot product:
    definition: >
      The sum of corresponding vector-component products; for unit vectors it equals the cosine of their angle.
    see: [dot-product-tests]
  unit vector:
    definition: >
      A vector with length one, used to represent direction independently of magnitude.
    see: [dot-product-tests]
  Lambertian diffuse lighting:
    definition: >
      A diffuse reflection model whose directional factor is the nonnegative dot product of the unit surface normal and the direction toward the light.
    see: [dot-product-tests]
  serialization:
    definition: >
      Converting selected structured data into a storable representation, with deserialization reconstructing that data.
    see: [save-state-serialization]
  JSON:
    expansion: JavaScript Object Notation
    definition: >
      A structured text format for objects, arrays, strings, numbers, booleans, and null; engine-specific types need an agreed representation.
    see: [save-state-serialization]
  save schema:
    definition: >
      The agreed names, types, identities, and relationships of data persisted by a game, including rules for format changes.
    see: [save-state-serialization]
  bit packing:
    definition: >
      Storing small values in individual bits or bit fields rather than allocating a whole byte or word to each value; eight yes/no flags fit in one byte.
    see: [save-state-serialization]
  alternating save slots:
    definition: >
      A persistence scheme that writes successive snapshots to different internal slots so a failed write can leave an older valid copy available.
    see: [alternating-save-slots]
  generation counter:
    definition: >
      A sequence number stored with a snapshot to order valid copies by recency; comparison must account for counter wraparound.
    see: [alternating-save-slots]
  decal:
    definition: >
      An image applied to an existing surface to add a local mark, such as a bullet impact or crack, without changing the base surface geometry.
    see: [destruction-state-swaps]
  strand hair:
    definition: >
      Hair represented by individual curves or strands rather than groups painted onto cards; the rendered and simulated strand counts can differ.
    see: [hair-cards, guide-hair-simulation]
  animation skeleton:
    definition: >
      A hierarchy of joints whose transforms deform attached mesh vertices, including card meshes used to animate a hairstyle.
    see: [hair-cards, inverse-kinematics]
  cached simulation:
    definition: >
      Motion calculated ahead of time and recorded for playback, reducing the runtime work and variability of a live simulation.
    see: [destruction-state-swaps]
  GPU:
    definition: Graphics processing unit, the processor that executes rendering and other highly parallel work.
    see: [gpu-instancing]
  CPU:
    definition: Central processing unit, the processor that runs game logic and submits work to the graphics processor.
    see: [gpu-instancing]
  GPU instancing:
    definition: Rendering many copies of one mesh with shared material state and per-instance data in a small number of draw calls.
    see: [gpu-instancing]
  draw call:
    definition: A command submitted to the graphics API to render a set of primitives with a specified state.
    see: [gpu-instancing, planar-reflections]
  vertex shader:
    definition: A GPU program that processes mesh vertices, including their positions, before rasterization.
    see: [gpu-instancing]
  overdraw:
    definition: Repeated pixel processing where multiple rendered surfaces cover the same part of the image.
    see: [gpu-instancing]
  SSR:
    definition: Screen-space reflections; tracing reflected directions against camera depth and color data, which cannot by itself supply unseen scene information.
    see: [screen-space-reflections]
  cubemap:
    definition: A directional image stored as six square faces, often used to represent the environment around a capture point.
    see: [cubemap-reflections, interior-mapping]
  reflection probe:
    definition: A placed environment capture and its influence region, used to supply nearby surfaces with approximate reflections.
    see: [cubemap-reflections]
  planar reflection:
    definition: A reflection rendered from a view mirrored across a plane, suitable for flat mirrors or approximately flat water.
    see: [planar-reflections]
  depth buffer:
    definition: A per-pixel record of visible surface depth, used for visibility tests and effects that reconstruct the camera's visible scene.
    see: [screen-space-reflections]
  roughness:
    definition: A material parameter describing small-scale surface variation that broadens and softens specular reflections.
    see: [cubemap-reflections, screen-space-reflections]
  deferred rendering:
    definition: A rendering approach that records visible surface properties in buffers before computing lighting from those buffers.
    see: [screen-space-reflections]
  HDRP:
    definition: High Definition Render Pipeline, Unity's render pipeline for high-fidelity graphics on supported hardware.
    see: [planar-reflections]
  interior mapping:
    definition: >
      Rendering virtual room surfaces behind a facade by intersecting the
      view ray with room bounds inside a shader, without room meshes.
    see: [interior-mapping]
  hair card:
    definition: >
      A textured strip of mesh that represents many individual hair strands
      as one surface, reducing the geometry needed for a hairstyle.
    see: [hair-cards]
  groom:
    definition: >
      An authored collection of hair or fur curves that defines the shape,
      direction, and grouping of strands.
    see: [hair-cards, guide-hair-simulation]
  guide strand:
    definition: >
      A representative hair curve whose simulated deformation is transferred
      to other strands so fewer curves need full physics updates.
    see: [guide-hair-simulation]
  prefracture:
    definition: >
      Dividing an asset into breakable fragments before runtime, leaving the
      game to decide when fragments detach and how they move.
    see: [prefractured-destruction]
  Geometry Collection:
    definition: >
      An Unreal Chaos asset containing geometry pieces and a hierarchy that
      can represent clusters of fragments for destruction simulation.
    see: [prefractured-destruction]
  rigid body:
    definition: >
      A physics object whose shape stays fixed while its position and
      orientation change under forces and collisions.
    see: [prefractured-destruction]
  flipbook:
    definition: >
      A sequence of images stored in a texture sheet and played by selecting
      successive cells, often to animate a particle without a live simulation.
    see: [flipbook-particles]
  texture atlas:
    definition: >
      One texture containing multiple image regions addressed with different
      texture coordinates, including the frames in a particle flipbook.
    see: [flipbook-particles]
  density field:
    definition: >
      A spatial function or sampled grid describing how much material, such
      as smoke, occupies each location.
    see: [volumetric-smoke]
  ray marching:
    definition: >
      Sampling at successive points along a ray to evaluate a field or
      accumulate a volume's appearance.
    see: [volumetric-smoke]
  UV:
    definition: >
      The two coordinate axes used to select positions in a texture,
      independent of the surface's position in the world.
    see: [flipbook-particles, interior-mapping, normal-mapping]
