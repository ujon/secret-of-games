# Unreal Engine feature-support registry.
# Maps a technique id (its path under wiki/ without the .md) to support info.
# Supported in Unreal version V when: since <= V and (until unset or V < until).
#
# Example:
#   gpu-instancing:
#     since: "4.22"
#     doc: https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component
engine: Unreal
techniques:
  # FMath::PerlinNoise2D/3D — likely landed earlier (~4.19; absent from 2016
  # forums), but 4.27 is the earliest version with verified API docs.
  perlin-noise-terrain:
    since: "4.27"
    doc: https://dev.epicgames.com/documentation/en-us/unreal-engine/API/Runtime/Core/FMath/PerlinNoise2D
  # Line traces are a core physics query shipped since early UE4; the doc
  # link is the current guide.
  raycast-line-of-sight:
    since: "4.0"
    doc: https://dev.epicgames.com/documentation/en-us/unreal-engine/traces-with-raycasts-in-unreal-engine
