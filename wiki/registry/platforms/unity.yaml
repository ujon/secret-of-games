# Unity feature-support registry.
# Maps a technique id (its path under wiki/ without the .md) to support info.
# Supported in Unity version V when: since <= V and (until unset or V < until).
#
# Example:
#   gpu-instancing:
#     since: "2018.1"
#     doc: https://docs.unity3d.com/Manual/GPUInstancing.html
engine: Unity
techniques:
  # Mathf.PerlinNoise — earliest hosted doc archive is 4.0; may predate it.
  perlin-noise-terrain:
    since: "4.0"
    doc: https://docs.unity3d.com/ScriptReference/Mathf.PerlinNoise.html
  # Physics.Raycast — earliest hosted doc archive is 4.0.
  raycast-line-of-sight:
    since: "4.0"
    doc: https://docs.unity3d.com/ScriptReference/Physics.Raycast.html
  # BillboardRenderer — earliest probed doc archive is 5.6; may predate it.
  billboarding:
    since: "5.6"
    doc: https://docs.unity3d.com/ScriptReference/BillboardRenderer.html
