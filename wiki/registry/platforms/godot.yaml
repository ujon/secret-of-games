# Godot feature-support registry.
# Maps a technique id (its path under wiki/ without the .md) to support info.
# Supported in Godot version V when: since <= V and (until unset or V < until).
#
# Example:
#   gpu-instancing:
#     since: "3.0"
#     doc: https://docs.godotengine.org/en/stable/tutorials/performance/using_multimesh.html
engine: Godot
techniques:
  # FastNoiseLite with noise_type TYPE_PERLIN shipped in 4.0; Godot 3.x
  # offered OpenSimplexNoise (gradient noise, but not Perlin) instead.
  perlin-noise-terrain:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/classes/class_fastnoiselite.html
  # RayCast3D is the Godot 4 name; 3.x shipped the same node as RayCast.
  raycast-line-of-sight:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/classes/class_raycast3d.html
  # BaseMaterial3D.billboard_mode; 3.x SpatialMaterial had billboard flags.
  billboarding:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/classes/class_basematerial3d.html
  # Frustum culling is automatic (and predates 4.0); doc is the current
  # 3D performance guide.
  frustum-culling:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/tutorials/performance/optimizing_3d_performance.html
  # Automatic mesh LOD arrived with Godot 4.0.
  level-of-detail:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/tutorials/3d/mesh_lod.html
  # SpatialMaterial's normal_enabled/normal_texture/normal_scale verified in
  # the 3.0 docs; 4.x renamed it StandardMaterial3D and added CanvasTexture
  # for 2D normal maps.
  normal-mapping:
    since: "3.0"
    doc: https://docs.godotengine.org/en/stable/tutorials/3d/standard_material_3d.html
  # doppler_tracking and attenuation_filter_cutoff_hz both verified in the
  # 3.0 class docs; reverb comes from AudioEffectReverb on a bus.
  spatial-audio-physics:
    since: "3.0"
    doc: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer3d.html
  # AudioStreamGenerator (push generated PCM frames from script) — doc-probe
  # verified: absent in 3.0, present from 3.1. Godot 4.x adds
  # AudioStreamPolyphonic (4.0) for assembling layers at runtime.
  procedural-sound-effects:
    since: "3.1"
    doc: https://docs.godotengine.org/en/stable/classes/class_audiostreamgenerator.html
  # AudioStreamInteractive (clip transitions, with a filler clip serving as
  # the stinger) and AudioStreamSynchronized (stacked layers) — doc-probe
  # verified: both absent in 4.2, present from 4.3.
  adaptive-music:
    since: "4.3"
    doc: https://docs.godotengine.org/en/stable/classes/class_audiostreaminteractive.html
  # SpringArm first appears in the 3.1 class archive (absent in 3.0). Godot
  # 4 renamed it SpringArm3D and can sweep the child camera's near plane.
  camera-collision-avoidance:
    since: "3.1"
    doc: https://docs.godotengine.org/en/stable/classes/class_springarm3d.html
  # MultiMesh existed before 3.0; hardware instancing in the GLES3 renderer
  # arrives with 3.0, replacing the older GLES2 multiple-call path.
  # https://godotengine.org/article/godots-new-renderer-progress-report-1/
  gpu-instancing:
    since: "3.0"
    doc: https://docs.godotengine.org/en/3.0/classes/class_multimesh.html
  # ReflectionProbe documented in 3.0 and introduced with its new renderer.
  cubemap-reflections:
    since: "3.0"
    doc: https://docs.godotengine.org/en/3.0/classes/class_reflectionprobe.html
  # The Godot 3.0 release explicitly announces SSR; renderer restrictions apply.
  # https://godotengine.org/article/godot-3-0-released/
  screen-space-reflections:
    since: "3.0"
    doc: https://docs.godotengine.org/en/3.0/tutorials/3d/environment_and_post_processing.html
  # No dedicated built-in planar-reflection component verified; do not register
  # general custom Viewport rendering as equivalent support.
  # SkeletonIK introduced in 3.1; renamed SkeletonIK3D in 4.x and
  # superseded by the maintained IKModifier3D family in 4.6.
  inverse-kinematics:
    since: "3.1"
    doc: https://godotengine.org/article/skeleton-inverse-kinematic/
  # Variant serialization existed in the 1.0-stable source (File.store_var
  # and get_var). Modern FileAccess and JSON workflows have newer APIs.
  save-state-serialization:
    since: "1.0"
    doc: https://github.com/godotengine/godot/blob/1.0-stable/core/bind/core_bind.cpp#L1258
  # Scope: the SpatialMaterial particle frame-grid properties introduced
  # with the Godot 3 material system, not the first possible animation of
  # sprites in any Godot version. In 4.x these live on BaseMaterial3D.
  flipbook-particles:
    since: "3.0"
    doc: https://docs.godotengine.org/en/3.0/classes/class_spatialmaterial.html
  # First support in 3.4: portals and spherical occluders. Godot 4.0 later
  # introduced the CPU raster occlusion implementation in the current guide.
  # https://godotengine.org/article/godot-3-4-is-released/
  occlusion-culling:
    since: "3.4"
    doc: https://docs.godotengine.org/en/stable/tutorials/3d/occlusion_culling.html
