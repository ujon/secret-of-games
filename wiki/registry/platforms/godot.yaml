# Godot feature-support registry.
# Maps a technique id (its path under wiki/ without the .md) to support info.
# Supported in Godot version V when: since <= V and (until unset or V < until).
#
# Example:
#   gpu-instancing:
#     since: "3.0"
#     doc: https://docs.godotengine.org/en/stable/tutorials/performance/using_multimesh.html
engine: Godot
techniques:
  # FastNoiseLite with noise_type TYPE_PERLIN shipped in 4.0; Godot 3.x
  # offered OpenSimplexNoise (gradient noise, but not Perlin) instead.
  perlin-noise-terrain:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/classes/class_fastnoiselite.html
  # RayCast3D is the Godot 4 name; 3.x shipped the same node as RayCast.
  raycast-line-of-sight:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/classes/class_raycast3d.html
  # BaseMaterial3D.billboard_mode; 3.x SpatialMaterial had billboard flags.
  billboarding:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/classes/class_basematerial3d.html
  # Frustum culling is automatic (and predates 4.0); doc is the current
  # 3D performance guide.
  frustum-culling:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/tutorials/performance/optimizing_3d_performance.html
  # Automatic mesh LOD arrived with Godot 4.0.
  level-of-detail:
    since: "4.0"
    doc: https://docs.godotengine.org/en/stable/tutorials/3d/mesh_lod.html
