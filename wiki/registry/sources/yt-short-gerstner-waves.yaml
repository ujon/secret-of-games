summary: |
  - Basic water = summing several sine waves of varying amplitude and
    frequency, applied over a 3D surface (The Wind Waker-style seas).
  - Sines are too round for sharp crests, so Gerstner waves move surface
    points in circles (horizontal + vertical), sharpening peaks.
  - Summed Gerstner waves look great from the side but tile into a visible
    checkerboard from above; modern games break it up with noise and
    specular reflection.
