tags: [design, platformer, collision]
summary: |
  - When a jump clips a ceiling corner, games nudge the character sideways
    so the jump continues instead of bonking.
  - Dashes into ledge corners get pushed up onto the platform; Super Mario
    has corner correction and speedrunners exploit it.
  - Related leniencies: wall jumps register slightly before touching the
    wall, and jumps off just-stopped moving platforms keep their momentum.
techniques:
  - corner-correction
