title: 게임 카메라에 숨겨진 수학 기법 (Math hidden in game cameras)
url: https://www.youtube.com/shorts/caPi9d2gP7I
author: 저세상개발자 (YouTube channel)
year: 2026
medium: video
status: draft
model: claude-fable-5
tags: [design, camera, game-feel]
summary: |
  - A camera glued to the character causes motion sickness and kills the
    sense of speed, so cameras deliberately lag — vertical follow lags
    even more so jumps read clearly.
  - Asymptotic averaging: every tick move the camera 10% of its remaining
    distance to the target — fast approach, gentle settle.
  - Deadzone: a region around the character where the camera doesn't move
    at all; it follows only when the character exits it.
techniques:
  - camera-smoothing-deadzone
