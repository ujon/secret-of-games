tags: [design, probability, gacha]
summary: |
  - True randomness allows brutal streaks, so games bound bad luck.
  - Genshin Impact's pity timer fills a counter on every miss and
    guarantees a 5-star at the cap; Tetris's shuffle bag fills a pouch
    with every piece and empties it before refilling — no long droughts.
  - Dota 2's pseudo-random distribution starts below the shown rate and
    multiplies the chance each miss, resetting on success, tuned so the
    expected trigger count matches the displayed probability.
techniques:
