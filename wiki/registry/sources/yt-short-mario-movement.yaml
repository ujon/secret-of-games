status: draft
model: claude-fable-5
tags: [design, platformer, game-feel]
summary: |
  - Mario decelerates gradually on release and skids on reversal — smooth
    motion plus fine control.
  - Jump height scales with button hold time; releasing early cuts upward
    velocity for a fast fall.
  - Running increases jump distance, and air control lets players correct
    mistakes mid-jump — advanced for its 1980s peers.
