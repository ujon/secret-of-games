tags: [physics, platformer, math]
summary: |
  - Real projectile motion has symmetric rise and fall, but games like
    Mario rise slower than they fall — better feel and easy variable jump
    height from button hold time.
  - Instead of evaluating the ideal parabola, games step: each frame add
    gravity to velocity, then velocity to position — Euler integration,
    fast and simple per frame.
  - Asymmetric gravity (lighter going up, heavier falling) shapes the
    designer's curve, not the physicist's.
