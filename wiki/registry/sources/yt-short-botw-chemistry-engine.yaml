summary: |
  - Breath of the Wild pairs its physics engine (motion/collision) with a
    "chemistry engine" managing state interactions.
  - Intangibles (fire, water, ice, electricity, wind) are elements;
    tangibles (wood, rock, the player) are materials.
  - Three rules: elements change materials' state; elements change each
    other (water douses fire); materials can't change materials — simple
    laws that generate BotW's emergent freedom, validated by prototype.
techniques:
