summary: |
  - Low resolution and tiny palettes bred strict craft rules: no double
    pixels (clumped lines), no jaggies (inconsistent slope steps).
  - Sub-pixel animation shifts colors within pixels to suggest motion
    smaller than one pixel — Metal Slug's signature smoothness.
  - Outlines use selective colors by lighting instead of pure black, and
    dithering crosses two colors in patterns to fake gradients within a
    limited palette.
