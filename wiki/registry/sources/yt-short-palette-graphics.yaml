summary: |
  - Storing Mario's sprite as raw 24-bit color was unaffordable on the
    Super Famicom.
  - Indexed color assigns each distinct color a small number — 13 colors
    fit in 4 bits per pixel — with the actual colors in a separate
    palette table (up to 16 entries).
  - Palette swaps recolor the same sprite data for variety, and limits on
    concurrent sprites/palettes kept RAM low — hence the era's uniform
    color feel.
techniques:
  - palette-indexed-graphics
