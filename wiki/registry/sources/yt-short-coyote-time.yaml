summary: |
  - Jumps pressed just after leaving a ledge still fire for a short
    window — coyote time, named for the cartoon cliff-hang.
  - Jumps pressed just before landing are queued and fire on touchdown —
    jump buffering; fighting games use the same input-buffer idea for
    combos.
  - Both hide tiny timing errors so controls feel fair.
