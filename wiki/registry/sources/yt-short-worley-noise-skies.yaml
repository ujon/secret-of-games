summary: |
  - Skies are faked with a skybox: a cube of sky imagery wrapped around the
    world that players mistake for distance.
  - Minecraft-style clouds are just thick, drifting textures; realistic
    clouds need math instead.
  - Worley noise scatters random points in a grid and colors each position
    by distance to the nearest point; layering several Worley octaves with
    Perlin noise yields natural cloud shapes.
