year: 2026
medium: video
status: draft
model: claude-fable-5
tags: [graphics, shaders, blending]
summary: |
  - Treating black as 0 and white as 1, adding two images' color values
    brightens — additive blending, which glows regardless of the backdrop,
    perfect for light effects (weak on bright backgrounds).
  - Multiplying color values darkens like mixing pigments — multiply
    blending for shadows (weak on dark backgrounds).
  - Games also use screen, alpha, and other blend modes to compose
    effects.
techniques:
  - blend-modes
