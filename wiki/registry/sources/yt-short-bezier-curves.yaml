summary: |
  - Bézier curves (from Renault engineer Pierre Bézier's CAD work) encode
    curves with a handful of control points.
  - A point sliding between moving endpoints traces the curve: two points
    give a line (linear), three a parabola (quadratic), four a cubic.
  - They now power fonts, vector icons, and springy animation easing —
    which is why easing functions are shipped as Béziers.
