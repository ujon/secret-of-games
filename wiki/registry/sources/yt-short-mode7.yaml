summary: |
  - Super Mario Kart's "3D" track is a warped 2D tilemap, not geometry.
  - Affine transforms move (add), scale (multiply), rotate, or shear
    coordinates; the Super Famicom applied them to a whole tile layer
    (Chrono Trigger's clock animation uses the same trick).
  - CRTs draw line by line, so scaling the tilemap differently per
    scanline fakes perspective — which is why every Mario Kart course is
    perfectly flat.
