title: 시간을 되감는 FPS 게임의 사격 판정 (Lag compensation in FPS games)
url: https://www.youtube.com/shorts/o7waSG4jROw
author: 저세상개발자 (YouTube channel)
year: 2026
medium: video
status: draft
model: claude-fable-5
tags: [netcode, fps]
summary: |
  - An opponent's position reaches you late (client → server → you), so
    shots at what you see would miss by the time the server judges them.
  - Servers rewind targets slightly into the past to judge hits at the
    moment the shooter actually saw, so players aim at what's on screen.
  - Side effect: the "shot behind cover" feeling — victims dislike it, but
    players tolerate it more than clear hits that miss.
techniques:
  - lag-compensation
