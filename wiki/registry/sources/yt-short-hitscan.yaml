status: draft
model: claude-fable-5
tags: [design, fps, hitscan]
summary: |
  - Hitscan skips projectile simulation: draw an instant ray along the aim
    and judge the hit immediately (fast; used in Rainbow Six, Overwatch).
  - Firing from the muzzle diverges from the crosshair (worst up close);
    firing from the camera hits exactly center-screen and feels intuitive.
  - Camera-origin enables the head-glitch (camera sees over cover the
    muzzle can't clear), so games use camera-based judgment but fail the
    shot when the muzzle is blocked.
techniques:
  - hitscan-shooting
