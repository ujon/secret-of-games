title: 랜덤 생성 던전을 게임이 만드는 방법 (How games build random dungeons)
url: https://www.youtube.com/shorts/_0qjqwigjLc
author: 저세상개발자 (YouTube channel)
year: 2026
medium: video
status: draft
model: claude-fable-5
tags: [design, procedural-generation, roguelike]
summary: |
  - Spelunky guarantees a completable main path first, types rooms by
    which sides connect, fills each type from handmade templates, then
    varies with obstacles and mirroring — random yet evenly difficult.
  - Dead Cells assembles fixed per-zone layouts from hand-authored tile
    sets: entrance/exit first, then special rooms, then random tiles.
  - The Binding of Isaac grows rooms outward from the start; dead ends
    become boss/treasure rooms and well-connected spots become secrets.
techniques:
  - procedural-dungeon-generation
