summary: |
  - Billboards are flat images that always face the camera — cheap depth
    illusion; Super Mario 64 used them for trees and round monsters.
  - Screen-aligned billboards stay parallel to the projection plane (used
    for particles and lens flares); viewpoint-oriented ones rotate
    individually to face the camera so objects don't look like they float.
  - Axis-aligned billboards lock the vertical axis and rotate only
    horizontally — right for grounded things like trees and grass; still
    used today for distant objects.
techniques:
