title: 게임 속 길찾기에 숨겨져 있는 수학 이론 (The math behind pathfinding)
url: https://www.youtube.com/shorts/qMGONAZGIqE
author: 저세상개발자 (YouTube channel)
year: 2026
medium: video
status: draft
model: claude-fable-5
tags: [ai, pathfinding, algorithms]
summary: |
  - Games partition terrain into regions connected as a graph, then compute
    shortest paths on it.
  - Dijkstra expands from the start by lowest travel cost; A* adds an
    obstacle-ignoring distance estimate (heuristic) so the search leans
    toward the goal — StarCraft used A*, recomputing on every click.
  - With too many agents, per-unit A* is too costly: flow fields
    precompute a direction per region toward the goal and units just
    follow them.
techniques:
  - astar-pathfinding
