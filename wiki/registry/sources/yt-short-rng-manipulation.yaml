year: 2025
medium: video
status: draft
model: claude-fable-5
tags: [classic, random, prng]
summary: |
  - Classic hardware can't produce true randomness: a seed initializes a
    pseudo-random sequence and rolls consume numbers from it — know the
    seed, know every outcome.
  - Pokémon Emerald seeded by time-since-boot: shiny Rayquaza at 3.3s
    after power-on reproduces exactly; Diamond/Pearl seeded from the
    console clock and menu timing, enabling seed-search tools.
  - Speedrunners manipulate seeds too (New SMB uses console ID, boot
    time, and double-jump counts) to force useful item drops.
techniques:
  - prng-seed-manipulation
