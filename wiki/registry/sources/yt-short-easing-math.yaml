summary: |
  - Linear motion looks robotic; easing curves start and end with zero
    velocity for natural movement.
  - Smoothstep is the simplest polynomial doing that; smootherstep also
    zeroes acceleration at the ends; ease-out-bounce mimics a bouncing
    ball's parabolas; ease-in-out-cubic accelerates through the middle for
    drama.
  - In practice games approximate these with Bézier curves instead of
    evaluating the functions directly.
