title: 비밀번호가 세이브 파일이 되었던 고전 게임 (Password saves in classic games)
url: https://www.youtube.com/shorts/ave58m6vuDw
author: 저세상개발자 (YouTube channel)
year: 2025
medium: video
status: draft
model: claude-fable-5
tags: [classic, saves, encoding]
summary: |
  - 1980s cartridges without battery-backed RAM couldn't store saves;
    Castlevania II shows a password at quit and rebuilds state from it.
  - Position isn't saved (you restart at the beginning); level and items
    are encoded compactly, salted with a random value so the same state
    yields different passwords, plus a checksum to block tampering.
  - Players effectively saved to paper notebooks and traded passwords —
    the era's normal.
techniques:
  - password-save-systems
