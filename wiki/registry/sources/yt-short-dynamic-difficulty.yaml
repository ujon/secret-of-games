tags: [design, difficulty]
summary: |
  - DDA tunes difficulty to live performance — Resident Evil 2 adjusts in
    real time so players stay in flow, neither bored nor stuck.
  - Mario Kart rubber-bands: trailing players get slower CPUs and better
    items; leading players get a "rival" CPU that ignores the course rules
    and speeds unnaturally to catch up.
  - Crash Bandicoot slows obstacles and spawns extra checkpoints/items
    after repeated deaths; skilled players resent DDA when they notice it.
