title: 게임 컨트롤러로 게임을 즉석에서 재구축하는 방법 (Rebuilding a game with controller input)
url: https://www.youtube.com/shorts/uj6016N96JY
author: 저세상개발자 (YouTube channel)
year: 2025
medium: video
status: draft
model: claude-fable-5
tags: [classic, exploit, memory]
summary: |
  - Classic consoles keep code and data in the same memory; the CPU just
    executes wherever its bookmark points.
  - If corrupted data overwrites memory unnoticed, the CPU can start
    "executing" data — and controller inputs are data, so inputs become
    programmable code after the glitch: arbitrary code execution.
  - Assembly/C-era games managed memory by hand, making such bugs common;
    TAS communities chain them (e.g. booting other games' scenes inside
    Super Mario World) — with enough controllers wired to robots you can
    type in a program.
techniques:
  - arbitrary-code-execution
